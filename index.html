<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realms of Might &amp; Magic</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    #game-container canvas {
      display: block;
    }

    /* Boot loading overlay — rendered instantly (before the JS bundle runs),
       so the player never sees a blank page during load. The bar animates via
       a compositor-thread transform, so it keeps moving even while the main
       thread is busy generating art. */
    #boot-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 34%, #1b2340 0%, rgba(27,35,64,0) 60%),
        #0a0912;
      color: #e9dcc0;
      font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      transition: opacity 0.5s ease;
    }
    #boot-loading.bl-hide { opacity: 0; pointer-events: none; }
    #boot-loading .bl-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: bold;
      color: #e8c060;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    #boot-loading .bl-sub { margin-top: 8px; font-size: 14px; color: #8b86a0; }
    #boot-loading .bl-stats { margin-top: 34px; font-size: 15px; color: #c9c2dd; letter-spacing: 0.3px; }
    #boot-loading .bl-resume { margin-top: 14px; font-size: 15px; color: #e8c060; min-height: 18px; font-weight: bold; }
    #boot-loading .bl-bar {
      margin-top: 30px;
      width: min(460px, 70vw);
      height: 12px;
      border: 1px solid #4a4560;
      border-radius: 6px;
      background: #14121f;
      overflow: hidden;
      position: relative;
    }
    #boot-loading .bl-bar-fill {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 40%;
      border-radius: 6px;
      background: linear-gradient(90deg, #4f7d34, #8fd15a, #4f7d34);
      animation: bl-slide 1.3s ease-in-out infinite;
    }
    @keyframes bl-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    #boot-loading .bl-status { margin-top: 16px; font-size: 12px; color: #8b86a0; }
    #boot-loading .bl-tip { margin-top: 30px; font-size: 13px; color: #cdb98a; min-height: 18px; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="boot-loading">
    <div class="bl-title">Realms of Might &amp; Magic</div>
    <div class="bl-sub">Turn-based conquest in the spirit of Heroes of Might and Magic III</div>
    <div class="bl-stats" id="bl-stats"></div>
    <div class="bl-resume" id="bl-resume"></div>
    <div class="bl-bar"><div class="bl-bar-fill" id="bl-fill"></div></div>
    <div class="bl-status" id="bl-status">Summoning the realm…</div>
    <div class="bl-tip" id="bl-tip"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
